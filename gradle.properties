# ==============================================================================
# Gradle
# ==============================================================================
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# ==============================================================================
# Fabric / Minecraft
#
# CrossMod targets Minecraft 26.3 with official Mojang mappings (Yarn has no
# 26.x releases yet). The mod is compiled against Fabric Loader 0.20.1 but is
# runtime compatible with every loader from 0.19.3 upwards - see the
# "fabricloader" entry in fabric.mod.json.
# ==============================================================================
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.2
fabric_api_version=0.164.0+26.3

# ==============================================================================
# Mod
# ==============================================================================
mod_version=0.1.0
maven_group=io.github.crossmod
archives_base_name=crossmod

# ==============================================================================
# Java
# ==============================================================================
java_version=25
